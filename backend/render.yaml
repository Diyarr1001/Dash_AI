services:
  - type: web
    name: dash-ai-backend
    env: docker
    dockerContext: .
    dockerfilePath: Dockerfile
    plan: free # Change to pro if needed for persistence
    envVars:
      - key: PORT
        value: 8000
      - key: DATABASE_URL
        value: sqlite:///./dash_ai.db
      - key: GROQ_API_KEY
        fromContext: groq_api_key
      - key: GEMINI_API_KEY
        fromContext: gemini_api_key
