services:
  - type: web
    name: dash-ai-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dash-ai-db
          property: connectionString
      - key: DUCKDB_DATABASE_PATH
        value: /opt/render/project/data/dashai.duckdb
      - key: SECRET_KEY
        generateValue: true
    disk:
      name: dash-ai-data
      mountPath: /opt/render/project/data
      sizeGB: 1
